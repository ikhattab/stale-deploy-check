version: 2
updates:
  # Covers .github/workflows and the root action.yml, and keeps the pinned SHAs current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The types follow the Node version CI builds with, not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
