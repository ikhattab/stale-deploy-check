name: Release

# Publishes the CLI to npm when a version tag is pushed. npm trusted publishing signs in with this
# workflow's OIDC token, so there's no npm token anywhere, and the package gets provenance.
# The npm environment waits for a maintainer to approve the run.
#
# Then submits the browser extension to the Chrome Web Store. The same OIDC token gets a Google access
# token through workload identity federation, so there's no Google key anywhere either. The one-time
# setup is in docs/releasing.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: a release shouldn't build from anything an earlier run left behind.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::$TAG doesn't match packages/cli/package.json ($version)"
            exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm publish
        working-directory: packages/cli

  extension:
    needs: publish
    runs-on: ubuntu-latest
    # Holds the IDs below, and only v*.*.* tags may deploy to it. Google only trusts this repo's jobs
    # in this environment, so nothing else can get the token.
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci
      - run: npm run package:extension

      - name: The extension version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./packages/extension/dist/chrome/manifest.json").version')
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::$TAG doesn't match the extension's manifest ($version)"
            exit 1
          fi
          echo "ZIP=packages/extension/dist/stale-deploy-check-extension-$version.zip" >> "$GITHUB_ENV"

      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 600s
          create_credentials_file: false

      - run: node scripts/publish-extension.mjs "$ZIP"
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: bcibhjoeiphifeicebippfihloijnanm
